version: '3.8'

services:
  jenkins:
    build:
      context: ./jenkins-container
    container_name: jenkins-project
    ports:
      - "8081:8080"
      - "50001:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true

volumes:
  jenkins_home: